name: Publicar sitio

# Publica el sitio en GitHub Pages cada vez que haces push a main.
# Cambiar de dominio = cambiar SITE_URL aquí abajo (o en Settings > Variables).

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el sitio
        env:
          # ← EL ÚNICO VALOR QUE CAMBIAS AL MIGRAR DE DOMINIO
          # Si defines la variable SITE_URL en Settings > Secrets and variables >
          # Actions > Variables, esa manda; si no, se usa el valor de aquí.
          SITE_URL: ${{ vars.SITE_URL || 'https://taropop.co' }}
        run: python3 build.py

      - name: Verificar que no haya enlaces rotos
        run: python3 verificar.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
